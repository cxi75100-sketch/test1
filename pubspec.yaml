name: ncpu_timetable
description: 南昌工学院本地课表 App。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.34.4
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0

# flutter_inappwebview_android 1.1.3 使用了 AGP 9 已移除的默认 ProGuard 文件。
# 固定到项目内同版本源码，仅修正该构建配置，避免依赖本机 Pub Cache 补丁。
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

flutter:
  uses-material-design: true
